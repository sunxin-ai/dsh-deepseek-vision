# dsh-design-qa 的 bundle 补丁层。
#
# DSH 通过 package.json 的 `dsh.bundle.patch` 找到本文件，在 `dsh plugin add` 时
# 自动把本包追加进 profile 的 `dsh.profile.bundles`。
#
# 行的 `name` 写**包名**而不是文件路径：Loader 的 baseUrl 是 profile 目录，
# 相对路径会解析到 profile 而不是包内。
#
# 识图路由不在这里声明 —— 补丁层的 config 是整体替换而非深合并，
# 在这里写 llm-pi-ai 会抹掉 $DSH_HOME/settings.yaml 里已有的其它路由。
# 路由、skill、本体补丁由 `node install.mjs --route-only` 补齐，见 README。
- insert:
    - id: design-qa
      name: dsh-design-qa
      config:
        provider: bailian
        model: qwen3.8-max
